<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">
  <title>Results summary component</title>
  <link rel="stylesheet" href="assets/style.css">
</head>

<body>
  <div class="card">
    <section class="result">
      <h1 class="title">Your Result</h1>
      <div class="score">
        <b>76</b>
        <p>of 100</p>
      </div>
      <h2>Great</h2>
      <p>You scored higher than 65% of the people who have taken these tests.</p>
    </section>
    <section class="summary">
      <h1 class="summary-title">Summary</h1>
      <div class="rows">
        <div class="badge">
          <div class="badge-title">
            <img src="assets/images/icon-reaction.svg" alt="reaction">
            <b>Reaction</b>
          </div>
          <p><b>80</b> <span class="outof">/ 100</span></p>
        </div>
        <div class="badge">
          <div class="badge-title">
            <img src="assets/images/icon-memory.svg" alt="memory">
            <b>Memory</b>
          </div>
          <p><b>92</b> <span class="outof">/ 100</span></p>
        </div>
        <div class="badge">
          <div class="badge-title">
            <img src="assets/images/icon-verbal.svg" alt="verbal">
            <b>Verbal</b>
          </div>
          <p><b>61</b> <span class="outof">/ 100</span></p>
        </div>
        <div class="badge">
          <div class="badge-title">
            <img src="assets/images/icon-visual.svg" alt="Visual">
            <b>Visual</b>
          </div>
          <p><b>72</b> <span class="outof">/ 100</span></p>
        </div>
      </div>
      <button class="continue-btn">Continue</button>
    </section>
  </div>

  <!-- Your Result
 
  
  Summary

  Reaction
  80 / 100

  Memory
  92 / 100

  Verbal
  61 / 100

  Visual
  72 / 100

  Continue -->
</body>

</html>
